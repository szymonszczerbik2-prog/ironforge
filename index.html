<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IronForge PRO — Offline Strength Tracker</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>window.__TAILWIND_BROWSER_DISABLE_WARNINGS__ = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#020617;--panel:rgba(15,23,42,.55);--panel2:rgba(2,6,23,.35);--border:rgba(148,163,184,.18);--text:#e2e8f0;--muted:#94a3b8;
--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--rose:#fb7185;--amber:#fbbf24;--shadow:0 20px 60px rgba(0,0,0,.55);
--glow-cyan:0 0 0 1px rgba(34,211,238,.12),0 0 24px rgba(34,211,238,.10);--glow-purple:0 0 0 1px rgba(168,85,247,.12),0 0 24px rgba(168,85,247,.10);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 800px at 20% 10%,rgba(34,211,238,.08),transparent 55%),radial-gradient(900px 700px at 80% 20%,rgba(168,85,247,.08),transparent 55%),radial-gradient(900px 700px at 50% 90%,rgba(52,211,153,.06),transparent 55%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;overflow:hidden;}
.app{height:100%;display:flex}
.sidebar{width:290px;min-width:290px;padding:14px;border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(15,23,42,.45),rgba(2,6,23,.15));backdrop-filter:blur(14px);overflow:auto}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(2,6,23,.35),rgba(2,6,23,.18));backdrop-filter:blur(14px)}
.content{flex:1;overflow:auto;padding:14px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px;backdrop-filter:blur(14px)}
.panel.soft{box-shadow:none}.panel.glow-cyan{box-shadow:var(--shadow),var(--glow-cyan)}.panel.glow-purple{box-shadow:var(--shadow),var(--glow-purple)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.muted{color:var(--muted)}
.btn{cursor:pointer;border:1px solid var(--border);background:rgba(15,23,42,.35);color:var(--text);padding:9px 12px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:rgba(15,23,42,.55);border-color:rgba(148,163,184,.28)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.14),rgba(168,85,247,.10))}
.btn.danger{border-color:rgba(251,113,133,.35);background:linear-gradient(180deg,rgba(251,113,133,.14),rgba(15,23,42,.25))}
.btn.good{border-color:rgba(52,211,153,.35);background:linear-gradient(180deg,rgba(52,211,153,.14),rgba(15,23,42,.25))}
.btn.sm{padding:8px 10px;border-radius:12px;font-size:13px}
.pill{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(2,6,23,.25);display:inline-flex;align-items:center;gap:8px;font-size:12px}
.badge{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(15,23,42,.35);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.badge.cyan{border-color:rgba(34,211,238,.35);color:#a5f3fc}.badge.purple{border-color:rgba(168,85,247,.35);color:#e9d5ff}.badge.emerald{border-color:rgba(52,211,153,.35);color:#bbf7d0}.badge.rose{border-color:rgba(251,113,133,.35);color:#fecdd3}.badge.amber{border-color:rgba(251,191,36,.35);color:#fde68a}
.input,.select,.textarea{width:100%;background:rgba(2,6,23,.35);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(34,211,238,.35);box-shadow:0 0 0 3px rgba(34,211,238,.10)}.textarea{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid rgba(148,163,184,.14);vertical-align:middle}th{text-align:left;font-size:12px;color:var(--muted);font-weight:600}
.kpi{padding:12px;border-radius:16px;border:1px solid var(--border);background:rgba(2,6,23,.22)}.kpi .v{font-size:20px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hr{height:1px;background:rgba(148,163,184,.14);margin:12px 0}
.navbtn{width:100%;justify-content:space-between;padding:10px 12px;border-radius:14px}.navbtn.active{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.12),rgba(168,85,247,.07))}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.small{font-size:12px}.hscroll{overflow:auto}
dialog{border:1px solid var(--border);border-radius:16px;background:rgba(2,6,23,.82);color:var(--text);backdrop-filter:blur(18px);box-shadow:var(--shadow);width:min(920px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.toast{position:fixed;right:14px;bottom:14px;width:min(460px,calc(100vw - 28px));z-index:70;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast .item{pointer-events:auto;padding:12px;border-radius:16px;border:1px solid var(--border);background:rgba(2,6,23,.7);backdrop-filter:blur(12px);box-shadow:var(--shadow);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.barwrap{height:170px;display:flex;gap:8px;align-items:flex-end;padding:10px 10px 24px;border-radius:16px;border:1px solid rgba(148,163,184,.14);background:rgba(2,6,23,.22);overflow-x:auto;overflow-y:hidden}
.bar{width:100%;min-width:26px;border-radius:10px;position:relative;cursor:pointer;background:linear-gradient(180deg,rgba(34,211,238,.75),rgba(168,85,247,.45));box-shadow:0 0 0 1px rgba(34,211,238,.12)}
.bar.sel{outline:2px solid rgba(251,191,36,.8);background:linear-gradient(180deg,rgba(251,191,36,.85),rgba(168,85,247,.5))}
.bar .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.progressRing{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:conic-gradient(rgba(34,211,238,.85) var(--p,0%),rgba(148,163,184,.14) 0%);border:1px solid rgba(148,163,184,.18)}
.progressRing>div{width:32px;height:32px;border-radius:999px;background:rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.14);display:grid;place-items:center;font-size:11px}
.hide{display:none !important}.cell{border-radius:10px;padding:8px 6px;text-align:center;border:1px solid rgba(148,163,184,.14);font-size:12px}
.selcol{background:rgba(251,191,36,.10)}
.ssnext{outline:2px solid rgba(34,211,238,.65);border-radius:12px;padding:6px;background:rgba(34,211,238,.06)}
.mobile-only{display:none !important}.desktop-only{display:block !important}
#mobileOverlay{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.58);backdrop-filter:blur(6px);display:none}#mobileOverlay.show{display:block}
#mobileTabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:8px;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(148,163,184,.18);background:rgba(2,6,23,.75);backdrop-filter:blur(16px)}
.tabbtn{flex:1;min-width:0;cursor:pointer;border:1px solid rgba(148,163,184,.18);background:rgba(15,23,42,.35);color:var(--text);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tabbtn .t{font-size:11px;color:var(--muted)}.tabbtn.active{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.12),rgba(168,85,247,.07))}
.stepper{display:flex;gap:8px;align-items:center}.stepper .input{text-align:center}
#sessionActionBar{position:fixed;left:10px;right:10px;z-index:34;display:none;gap:10px;padding:10px;border-radius:18px;border:1px solid rgba(148,163,184,.18);background:rgba(2,6,23,.75);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
#sessionActionBar .info{min-width:0;display:flex;flex-direction:column;gap:2px}#sessionActionBar .title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}#sessionActionBar .sub{font-size:12px;color:var(--muted)}
@media (max-width:980px){body{height:100dvh;overflow:hidden}.app{height:100dvh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);min-width:0;z-index:40;transform:translateX(-110%);transition:transform .18s ease}.sidebar.open{transform:translateX(0)}
.main{width:100%}.topbar{flex-direction:column;align-items:stretch}.topbar>*{width:100%}.content{padding-bottom:98px}body[data-route="session"] .content{padding-bottom:190px}
.input,.select,.textarea{font-size:16px}dialog{width:calc(100vw - 14px);height:92dvh;max-height:92dvh}
.mobile-only{display:block !important}.desktop-only{display:none !important}#mobileTabbar{display:flex}#sessionActionBar{bottom:calc(78px + env(safe-area-inset-bottom))}
.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:repeat(1,minmax(0,1fr))}}
</style>
</head>
<body data-route="session">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="panel soft" style="padding:12px;">
      <div class="row" style="justify-content:space-between;">
        <div class="row" style="gap:12px;">
          <div class="panel soft glow-cyan" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;"><i data-lucide="anvil" style="width:20px;height:20px;"></i></div>
          <div class="stack" style="gap:2px;"><div style="font-weight:800;">IronForge <span style="color:#67e8f9;">PRO</span></div><div class="muted small">Offline • localStorage • SPA</div></div>
        </div>
        <div class="pill mono" id="storageIndicator"><i data-lucide="database" style="width:14px;height:14px;"></i><span id="storageStatus">OK</span></div>
      </div>
    </div>
    <div class="hr"></div><nav class="stack" style="gap:8px;" id="nav"></nav><div class="hr"></div>
    <div class="panel soft" style="padding:12px;">
      <div class="row" style="justify-content:space-between;">
        <div class="stack" style="gap:4px;"><div class="small muted">Aktywna sesja</div><div id="activeSessionMini" class="mono small">—</div></div>
        <button class="btn primary" data-action="go-session"><i data-lucide="dumbbell" style="width:16px;height:16px;"></i>Trening</button>
      </div>
      <div class="hr"></div>
      <div class="row">
        <button class="btn" data-action="export-json"><i data-lucide="download" style="width:16px;height:16px;"></i>Eksport</button>
        <button class="btn" data-action="open-import"><i data-lucide="upload" style="width:16px;height:16px;"></i>Import</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="stack" style="gap:2px;">
        <div class="row" style="gap:10px;"><div class="badge purple"><i data-lucide="sparkles" style="width:14px;height:14px;"></i><span id="routeTitle">TRENINGI</span></div><div class="badge cyan mono" id="nowBadge"></div></div>
        <div class="small muted" id="routeSubtitle">Aktywna sesja</div>
      </div>
      <div class="row" style="justify-content:flex-end;">
        <div class="panel soft" style="padding:8px 10px;border-radius:16px;width:100%;">
          <div class="row" style="gap:10px;">
            <div class="row" style="gap:10px;">
              <div class="progressRing" id="restRing" style="--p:0%;"><div class="mono" id="restRingText">0%</div></div>
              <div class="stack" style="gap:2px;"><div class="small muted">Timer odpoczynku</div><div class="row" style="gap:8px;align-items:baseline;"><div class="mono" id="restLabel">—</div><span class="small muted" id="restHint"></span></div></div>
            </div>
            <div class="row" style="gap:8px;">
              <button class="btn sm" data-action="rest-preset" data-sec="60">60s</button>
              <button class="btn sm" data-action="rest-preset" data-sec="90">90s</button>
              <button class="btn sm" data-action="rest-preset" data-sec="120">120s</button>
              <button class="btn sm" data-action="rest-custom"><i data-lucide="timer" style="width:16px;height:16px;"></i>Własny</button>
              <button class="btn sm danger" data-action="rest-skip"><i data-lucide="skip-forward" style="width:16px;height:16px;"></i></button>
            </div>
            <div class="stack" style="gap:2px;min-width:190px;">
              <div class="small muted">Stoper treningu</div>
              <div class="row" style="justify-content:space-between;"><div class="mono" id="workoutStopwatch">00:00:00</div>
                <button class="btn good sm" data-action="finish-workout"><i data-lucide="flag" style="width:16px;height:16px;"></i>Zakończ</button></div>
            </div>
          </div>
        </div>
        <button class="btn primary desktop-only" data-action="quick-new-workout"><i data-lucide="plus" style="width:16px;height:16px;"></i>Nowy</button>
      </div>
    </header>
    <section class="content" id="view"></section>
  </main>
</div>
<div id="mobileOverlay" data-action="close-sidebar"></div><div id="mobileTabbar"></div><div id="sessionActionBar"></div>

<dialog id="exercisePicker"><form method="dialog" style="padding:14px;">
  <div class="row" style="justify-content:space-between;">
    <div class="row" style="gap:10px;"><div class="badge cyan"><i data-lucide="search" style="width:14px;height:14px;"></i><span>Wybierz ćwiczenie</span></div><div class="badge purple" id="pickerContextBadge">—</div></div>
    <button class="btn" value="cancel"><i data-lucide="x" style="width:16px;height:16px;"></i>Zamknij</button>
  </div><div class="hr"></div>
  <div class="grid2">
    <div class="stack"><label class="small muted">Szukaj</label><input class="input" id="pickerSearch" placeholder="np. Przysiad..."></div>
    <div class="stack"><label class="small muted">Kategoria</label><select class="select" id="pickerCategory"><option value="">Wszystkie</option><option>Klatka</option><option>Plecy</option><option>Nogi</option><option>Barki</option><option>Biceps</option><option>Triceps</option><option>Brzuch</option></select></div>
  </div><div class="hr"></div>
  <div class="panel soft" style="padding:10px;max-height:55vh;overflow:auto;"><table><thead><tr><th>Nazwa</th><th>Kategoria</th><th class="desktop-only">Opis</th><th style="text-align:right;">Akcja</th></tr></thead><tbody id="pickerTbody"></tbody></table></div>
</form></dialog>

<dialog id="templateDialog"><form method="dialog" style="padding:14px;">
  <div class="row" style="justify-content:space-between;"><div class="badge purple"><i data-lucide="layout-template" style="width:14px;height:14px;"></i><span>Szablon serii</span></div><button class="btn" value="cancel"><i data-lucide="x" style="width:16px;height:16px;"></i>Zamknij</button></div>
  <div class="hr"></div>
  <div class="grid3">
    <div class="stack"><label class="small muted">Ciężar bazowy (kg)</label><input class="input mono" id="tplWeight" type="number" min="0" step="0.5" value="60"></div>
    <div class="stack"><label class="small muted">Powtórzenia bazowe</label><input class="input mono" id="tplReps" type="number" min="1" step="1" value="8"></div>
    <div class="stack"><label class="small muted">Zastąp istniejące serie</label><label class="btn" style="justify-content:flex-start;"><input type="checkbox" id="tplReplace" checked style="accent-color:var(--cyan);"><span class="small">Tak</span></label></div>
  </div><div class="hr"></div><div class="stack" id="tplList"></div>
</form></dialog>

<dialog id="customRestDialog"><form method="dialog" style="padding:14px;">
  <div class="row" style="justify-content:space-between;"><div class="badge cyan"><i data-lucide="timer" style="width:14px;height:14px;"></i><span>Własny timer</span></div><button class="btn" value="cancel"><i data-lucide="x" style="width:16px;height:16px;"></i>Zamknij</button></div>
  <div class="hr"></div>
  <div class="grid2">
    <div class="stack"><label class="small muted">Sekundy</label><input class="input mono" id="customRestSeconds" type="number" min="5" step="5" value="90"></div>
    <div class="stack"><label class="small muted">Ustaw jako domyślne</label><label class="btn" style="justify-content:flex-start;"><input type="checkbox" id="customRestDefault" style="accent-color:var(--cyan);"><span class="small">Tak</span></label></div>
  </div><div class="hr"></div>
  <div class="row" style="justify-content:flex-end;"><button class="btn primary" value="ok" data-action="custom-rest-apply"><i data-lucide="play" style="width:16px;height:16px;"></i>Start</button></div>
</form></dialog>

<dialog id="importDialog"><form method="dialog" style="padding:14px;">
  <div class="row" style="justify-content:space-between;"><div class="badge purple"><i data-lucide="upload" style="width:14px;height:14px;"></i><span>Import z JSON</span></div><button class="btn" value="cancel"><i data-lucide="x" style="width:16px;height:16px;"></i>Zamknij</button></div>
  <div class="hr"></div><input class="input" id="importFile" type="file" accept="application/json"><div class="small muted" style="margin-top:8px;">Import nadpisuje całą bazę.</div><div class="hr"></div>
  <div class="row" style="justify-content:flex-end;"><button class="btn danger" value="ok" data-action="import-json"><i data-lucide="alert-triangle" style="width:16px;height:16px;"></i>Importuj i nadpisz</button></div>
</form></dialog>

<div class="toast" id="toast"></div>

<script>
;(() => {
'use strict';
/* ========== UTILS ========== */
const STORAGE_KEY='ironforgepro.v1';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pad2=n=>String(n).padStart(2,'0');
const fmtDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const fmtDateTime=ts=>{const d=new Date(ts);return `${fmtDate(ts)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;};
const fmtDuration=s=>{s=Math.max(0,Math.floor(s));return `${pad2(Math.floor(s/3600))}:${pad2(Math.floor((s%3600)/60))}:${pad2(s%60)}`;};
const fmtCompact=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}m`:(m>0?`${m}m ${s%60}s`:`${s}s`);};
const r1=n=>Math.round((Number(n)||0)*10)/10;const r0=n=>Math.round(Number(n)||0);
const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d;};
const uid=(p='id')=>`${p}_${Math.random().toString(16).slice(2)}_${Date.now().toString(16)}`;
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const startOfWeekMon=ts=>{const d=startOfDay(new Date(ts));d.setDate(d.getDate()-((d.getDay()+6)%7));return d;};
const startOfMonth=ts=>{const d=startOfDay(new Date(ts));d.setDate(1);return d;};
const startOfYear=ts=>{const d=startOfDay(new Date(ts));d.setMonth(0,1);return d;};
const weekKey=ts=>{const d=startOfWeekMon(ts);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;};
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const roundToStep=(v,step)=>Math.round(v/step)*step;

function toast(msg,type='info',t=3200){
  const host=document.getElementById('toast'),id=uid('t');
  const cls=type==='success'?'emerald':type==='danger'?'rose':type==='warn'?'amber':'cyan';
  const icon=type==='success'?'check-circle':type==='danger'?'x-circle':type==='warn'?'alert-triangle':'info';
  const el=document.createElement('div');el.className='item';el.id=id;
  el.innerHTML=`<div class="badge ${cls}"><i data-lucide="${icon}" style="width:14px;height:14px;"></i><span>${esc(msg)}</span></div>
    <button class="btn sm" data-action="toast-close" data-id="${id}"><i data-lucide="x" style="width:14px;height:14px;"></i></button>`;
  host.appendChild(el);icons();if(t>0)setTimeout(()=>document.getElementById(id)?.remove(),t);
}
const fallback={'anvil':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15h16"/><path d="M7 15l2-6h6l2 6"/></svg>'};
function icons(){try{if(window.lucide?.createIcons){window.lucide.createIcons();return;}}catch(_){}
  document.querySelectorAll('i[data-lucide]').forEach(i=>{const n=i.getAttribute('data-lucide');if(fallback[n])i.outerHTML=`<span style="display:inline-flex;">${fallback[n]}</span>`;});}

/* ========== DATA ========== */
const BUILTIN=[

function normalize(raw){
  const s=raw&&typeof raw==='object'?raw:{};const o=clone(DEFAULT_STATE);
  o.meta={...o.meta,...(s.meta||{})};o.settings={...o.settings,...(s.settings||{})};
  o.settings.progression={...clone(DEFAULT_STATE.settings.progression),...((s.settings||{}).progression||{})};
  o.settings.restByType={...clone(DEFAULT_STATE.settings.restByType),...((s.settings||{}).restByType||{})};
  if(Array.isArray(s.exercises)&&s.exercises.length)o.exercises=s.exercises;
  if(Array.isArray(s.plans))o.plans=s.plans;if(Array.isArray(s.history))o.history=s.history;
  if(Array.isArray(s.body))o.body=s.body;
  if(s.progression&&typeof s.progression==='object')o.progression=s.progression;
  if(s.sessionActive&&typeof s.sessionActive==='object')o.sessionActive=s.sessionActive;
  o.exercises=o.exercises.map(e=>({id:e.id||uid('ex'),source:e.source||'custom',alts:e.alts||[],...e}));
  o.plans=o.plans.map(p=>({id:p.id||uid('plan'),name:p.name||'Plan',archived:!!p.archived,createdAt:p.createdAt||Date.now(),
    days:(p.days||[]).map(d=>({id:d.id||uid('day'),name:d.name||'Dzień',exercises:(d.exercises||[]).map(x=>({id:x.id||uid('px'),superset:'',restSec:0,...x}))}))}));
  o.history=o.history.map(w=>({id:w.id||uid('w'),name:w.name||'Trening',startedAt:w.startedAt||Date.now(),endedAt:w.endedAt||w.startedAt||Date.now(),

  o.meta.updatedAt=Date.now();return o;
}

function progCfg(exName){const g=App.state.settings.progression;const o=App.state.progression[exName]||{};
  return {mode:o.mode||g.mode,incKg:num(o.incKg,g.incKg),targetRPE:num(o.targetRPE,g.targetRPE),repMin:num(o.repMin,g.repMin),repMax:num(o.repMax,g.repMax),roundStep:num(o.roundStep,g.roundStep),custom:Object.keys(o).length>0};}

function lastPerformance(exName){for(const w of App.state.history){for(const ex of (w.exercises||[])){if(baseName(ex)!==exName)continue;
  const sets=(ex.sets||[]).filter(s=>s.status==='done'&&(s.type==='work'||s.type==='failure'));if(sets.length)return {workout:w,sets,date:w.endedAt||w.startedAt};}}return null;}
function suggest(exName){
  const cfg=progCfg(exName);const last=lastPerformance(exName);
  if(!last)return {none:true,cfg,reason:'Brak historii — zaloguj pierwszy trening.'};
  const top=Math.max(...last.sets.map(s=>num(s.weight)));const topSets=last.sets.filter(s=>num(s.weight)===top);
  const minReps=Math.min(...topSets.map(s=>num(s.reps)));const avgRPE=r1(topSets.reduce((a,s)=>a+num(s.rpe,8),0)/topSets.length);
  let weight=top,reps=minReps,reason='',tone='cyan';
  if(cfg.mode==='linear'){weight=top+cfg.incKg;reps=cfg.repMin;reason=`Progresja liniowa: +${cfg.incKg} kg do ${cfg.repMin} powt.`;tone='emerald';}
  else if(cfg.mode==='rpe'){const diff=cfg.targetRPE-avgRPE;const delta=roundToStep(top*0.03*diff,cfg.roundStep);weight=Math.max(0,top+delta);reps=minReps;
    reason=`Autoregulacja: ostatnie RPE ${avgRPE} vs cel ${cfg.targetRPE} → ${delta>=0?'+':''}${r1(delta)} kg.`;tone=delta>0?'emerald':delta<0?'rose':'cyan';}
  else{if(minReps>=cfg.repMax&&avgRPE<=cfg.targetRPE){weight=top+cfg.incKg;reps=cfg.repMin;reason=`Szczyt zakresu (${minReps}≥${cfg.repMax}) przy RPE ${avgRPE} → +${cfg.incKg} kg, reset do ${cfg.repMin}.`;tone='emerald';}
    else if(avgRPE>=9.5){weight=Math.max(0,top-cfg.incKg);reps=minReps;reason=`RPE ${avgRPE} (bardzo ciężko) → obniż o ${cfg.incKg} kg i odbuduj.`;tone='rose';}
    else{weight=top;reps=Math.min(minReps+1,cfg.repMax);reason=`Dokładaj powtórzenia: ${minReps} → ${reps} przy ${top} kg (RPE ${avgRPE}).`;tone='cyan';}}
  weight=r1(Math.max(0,roundToStep(weight,cfg.roundStep)));
  return {none:false,cfg,weight,reps:r0(reps),reason,tone,last:{top,minReps,avgRPE,date:last.date,sets:last.sets.length}};
}
function applySuggestion(sxId){const sess=App.state.sessionActive;if(!sess)return;const ex=sess.exercises.find(x=>x.id===sxId);if(!ex)return;
  const s=suggest(baseName(ex));if(s.none){toast('Brak danych do sugestii.','warn');return;}let n=0;
  ex.sets.forEach(set=>{if(set.status==='pending'&&(set.type==='work'||set.type==='failure')){set.weight=s.weight;set.reps=s.reps;n++;}});
  save();render();toast(n?`Zastosowano: ${s.weight} kg × ${s.reps} (${n} serii)`:'Brak serii pending do uzupełnienia.',n?'success':'warn');}
function autoFillSessionExerciseFromSuggestion(sxId){const sess=App.state.sessionActive;if(!sess)return;const ex=sess.exercises.find(x=>x.id===sxId);if(!ex)return;
  if(ex.sets.some(s=>num(s.weight)>0||num(s.reps)>0))return;const sg=suggest(baseName(ex));if(sg.none)return;
  ex.sets.forEach(set=>{if(set.status==='pending'&&(set.type==='work'||set.type==='failure')){set.weight=sg.weight;set.reps=sg.reps;}});}
function autoUpdatePlanFromFinishedSession(planId,dayId,sess){const p=App.state.plans.find(x=>x.id===planId);const d=p?.days.find(x=>x.id===dayId);if(!p||!d||!sess)return;

/* ========== HARD SETS / PERIODS ========== */
const MUSCLES=['Klatka','Plecy','Nogi','Barki','Biceps','Triceps','Brzuch'];
const isHardSet=s=>s.status==='done'&&(s.type==='work'||s.type==='failure'||s.type==='dropset')&&num(s.rpe,0)>=num(App.state.settings.hardSetRPE,7);

function bucketStart(ts,mode){return mode==='month'?startOfMonth(ts):mode==='year'?startOfYear(ts):startOfWeekMon(ts);}
function bucketNext(d,mode){const x=new Date(d);if(mode==='month'){x.setMonth(x.getMonth()+1,1);}else if(mode==='year'){x.setFullYear(x.getFullYear()+1,0,1);}else{x.setDate(x.getDate()+7);}x.setHours(0,0,0,0);return x;}
function bucketLabel(d,mode){if(mode==='month')return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;if(mode==='year')return `${d.getFullYear()}`;return fmtDate(d.getTime()).slice(5);}
function bucketLongLabel(b,mode){const d=new Date(b.start);if(mode==='week'){const e=new Date(b.end-1);return `Tydz. ${fmtDate(b.start)} – ${fmtDate(e.getTime())}`;}
  if(mode==='month')return `Miesiąc ${d.getFullYear()}-${pad2(d.getMonth()+1)}`;return `Rok ${d.getFullYear()}`;}
function bucketsForMode(mode){
  const ts=[...(App.state.history||[]).map(w=>num(w.endedAt||w.startedAt,Date.now())),...(App.state.body||[]).map(b=>num(b.ts,Date.now()))];
  const minTs=ts.length?Math.min(...ts):Date.now();
  const first=bucketStart(minTs,mode),last=bucketStart(Date.now(),mode);const out=[];let cur=new Date(first);
  let guard=0;while(cur.getTime()<=last.getTime()&&guard++<2000){const next=bucketNext(cur,mode);out.push({start:cur.getTime(),end:next.getTime(),label:bucketLabel(cur,mode)});cur=next;}
  return out;
}
function periodSummary(b){
  const ws=(App.state.history||[]).filter(w=>{const t=num(w.endedAt||w.startedAt);return t>=b.start&&t<b.end;});
  let hard=0;for(const w of ws)for(const ex of (w.exercises||[]))for(const s of (ex.sets||[]))if(isHardSet(s))hard++;
  return{workouts:ws.length,timeSec:ws.reduce((a,w)=>a+num(w.durationSec),0),tonnage:ws.reduce((a,w)=>a+num(w.tonnage),0),sets:ws.reduce((a,w)=>a+num(w.totalSets),0),hard};
}
function hardSetsMatrixByMode(mode){
  const buckets=bucketsForMode(mode);const data={};MUSCLES.forEach(m=>data[m]=buckets.map(()=>0));const vol={};MUSCLES.forEach(m=>vol[m]=buckets.map(()=>0));
  for(const w of (App.state.history||[])){const t=num(w.endedAt||w.startedAt);const bi=buckets.findIndex(x=>t>=x.start&&t<x.end);if(bi<0)continue;
    for(const ex of (w.exercises||[])){const cat=baseCat(ex);const g=MUSCLES.includes(cat)?cat:'Brzuch';
      for(const s of (ex.sets||[])){if(isHardSet(s))data[g][bi]++;if(s.status==='done')vol[g][bi]+=num(s.weight)*num(s.reps);}}}
  const totals=buckets.map((_,i)=>MUSCLES.reduce((a,m)=>a+data[m][i],0));const max=Math.max(1,...MUSCLES.flatMap(m=>data[m]));
  return {buckets,data,vol,totals,max};
}
function hardSetsMatrix(weeksBack=6){const m=hardSetsMatrixByMode('week');const n=m.buckets.length;const from=Math.max(0,n-weeksBack);
  const sl=a=>a.slice(from);const data={},vol={};MUSCLES.forEach(g=>{data[g]=sl(m.data[g]);vol[g]=sl(m.vol[g]);});return {weeks:sl(m.buckets),data,vol,totals:sl(m.totals),max:m.max};}
function thisWeekHardSets(){const st=startOfWeekMon(Date.now()).getTime();return periodSummary({start:st,end:st+7*86400000}).hard;}

/* ========== BODY WEIGHT ========== */
function bodySorted(){return [...(App.state.body||[])].sort((a,b)=>a.ts-b.ts);}
function bodyDelta(start,end){const arr=bodySorted();const inP=arr.filter(e=>e.ts>=start&&e.ts<end);if(!inP.length)return null;
  const before=[...arr].reverse().find(e=>e.ts<start);const from=before||inP[0],to=inP[inP.length-1];return {from:from.kg,to:to.kg,delta:r1(to.kg-from.kg),n:inP.length};}
function fmtDelta(d,unit='',pct=false){if(d==null)return '—';const s=d>0?'+':'';return `${s}${pct?r0(d):r1(d)}${unit}`;}

function sessSetField(sxId,setId,f,v){const s=App.state.sessionActive;if(!s)return;const ex=s.exercises.find(x=>x.id===sxId);if(!ex)return;const set=ex.sets.find(x=>x.id===setId);if(!set)return;
  if(f==='type')set.type=v;else if(f==='weight')set.weight=clamp(r1(num(v)),0,2000);else if(f==='reps')set.reps=clamp(r0(num(v)),0,999);else if(f==='rpe')set.rpe=clamp(r1(num(v,8)),0,10);save();}
function sessExField(sxId,f,v){const s=App.state.sessionActive;if(!s)return;const ex=s.exercises.find(x=>x.id===sxId);if(!ex)return;

function toggleStatus(sxId,setId){const s=App.state.sessionActive;if(!s)return;const ex=s.exercises.find(x=>x.id===sxId);if(!ex)return;const set=ex.sets.find(x=>x.id===setId);if(!set)return;

function stats(sess){if(!sess)return{tonnage:0,totalSets:0,doneSets:0,exercises:0,hard:0};let tonnage=0,totalSets=0,doneSets=0,hard=0;
  for(const ex of sess.exercises)for(const s of ex.sets){totalSets++;if(s.status==='done'){doneSets++;tonnage+=num(s.weight)*num(s.reps);if(isHardSet(s))hard++;}}
  return{tonnage,totalSets,doneSets,exercises:sess.exercises.length,hard};}

  else if(f==='rpe')x.rpe=clamp(r1(num(v,8)),0,10);else if(f==='restSec')x.restSec=clamp(r0(num(v,0)),0,3600);else x[f]=String(v||'');save();}

/* ========== PR ========== */
function doneSets(w){const o=[];for(const ex of (w.exercises||[]))for(const s of (ex.sets||[]))if(s.status==='done')
  o.push({name:baseName(ex),cat:baseCat(ex),weight:num(s.weight),reps:num(s.reps),rpe:num(s.rpe),vol:num(s.weight)*num(s.reps)});return o;}
function computePRs(){const m=new Map();for(const w of App.state.history)for(const s of doneSets(w)){if(!m.has(s.name))m.set(s.name,{name:s.name,cat:s.cat,mw:0,mr:0,mv:0,m1:0});
  const r=m.get(s.name);r.mw=Math.max(r.mw,s.weight);r.mr=Math.max(r.mr,s.reps);r.mv=Math.max(r.mv,s.vol);r.m1=Math.max(r.m1,epley(s.weight,s.reps));}
  return [...m.values()].sort((a,b)=>b.m1-a.m1);}
function achievements(){const all=App.state.history.flatMap(doneSets);const c100=all.some(s=>s.weight>=100);const life=App.state.history.reduce((a,w)=>a+num(w.tonnage),0);
  const dates=App.state.history.map(w=>startOfDay(new Date(w.endedAt||w.startedAt)).getTime()).sort((a,b)=>b-a);let st10=false;
  if(dates.length>=10){st10=true;const l=dates.slice(0,10);for(let i=0;i<l.length-1;i++)if((l[i]-l[i+1])/86400000>2.01){st10=false;break;}}
  const wt=new Map();for(const w of App.state.history){const k=weekKey(w.endedAt||w.startedAt);wt.set(k,(wt.get(k)||0)+num(w.tonnage));}
  const w10k=[...wt.values()].some(v=>v>=10000);const hs80=hardSetsMatrixByMode('week').totals.some(t=>t>=80);
  return[{n:'Klub 100kg',d:'Seria ≥100 kg.',u:c100,i:'badge-check'},{n:'10 treningów z rzędu',d:'10 sesji bez przerw >2 dni.',u:st10,i:'flame'},
    {n:'Kowadło 50k',d:'50 000 kg tonażu łącznie.',u:life>=50000,i:'anvil'},{n:'Tydzień 10k',d:'10 000 kg w jednym tygodniu.',u:w10k,i:'calendar-check'},
    {n:'Maszyna objętości',d:'80+ hard sets w tygodniu.',u:hs80,i:'activity'}];}

/* ========== REST TIMER ========== */
function startRest(sec){sec=clamp(Math.floor(num(sec,90)),5,3600);App.ui.rest={running:true,durationSec:sec,endsAt:Date.now()+sec*1000};updateRest();}
function skipRest(){App.ui.rest={running:false,endsAt:null,durationSec:0};updateRest();}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.4);setTimeout(()=>c.close().catch(()=>{}),700);}catch(e){}}
function updateRest(){const l=document.getElementById('restLabel'),h=document.getElementById('restHint'),r=document.getElementById('restRing'),t=document.getElementById('restRingText');if(!l)return;
  if(!App.ui.rest.running||!App.ui.rest.endsAt){l.textContent='—';h.textContent='';r.style.setProperty('--p','0%');t.textContent='0%';return;}
  const total=App.ui.rest.durationSec*1000,left=Math.max(0,App.ui.rest.endsAt-Date.now());const pct=Math.round(clamp((total-left)/Math.max(1,total),0,1)*100);
  l.textContent=Math.ceil(left/1000)+'s';h.textContent=left<=3000?'gotowy...':'';r.style.setProperty('--p',pct+'%');t.textContent=pct+'%';
  if(left<=0){App.ui.rest={running:false,endsAt:null,durationSec:0};beep();toast('Koniec odpoczynku.','success',2200);}}
function updateStopwatch(){const el=document.getElementById('workoutStopwatch');if(!el)return;const s=App.state.sessionActive;el.textContent=s?fmtDuration(Math.floor((Date.now()-s.startedAt)/1000)):'00:00:00';}

/* ===== SUPERSERIE (GUIDED) ===== */
function ssGroup(ss){const s=App.state.sessionActive;if(!s)return[];const key=String(ss||'').trim();return s.exercises.filter(x=>String(x.superset||'').trim()===key);}
function ssNext(exs){const rounds=Math.max(1,...exs.map(e=>e.sets.length));for(let i=0;i<rounds;i++)for(const ex of exs){const st=ex.sets[i];if(st&&st.status==='pending')return {sx:ex.id,set:st.id,round:i,name:ex.name};}return null;}
function supersetAddRound(ss){ssGroup(ss).forEach(ex=>sessAddSet(ex.id));}
function scrollToNext(){setTimeout(()=>{const el=document.getElementById('ssnext');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);}
function supersetSetCell(ex,set,isNext){const v=num(set.weight)*num(set.reps);const sxId=ex.id;
  return `<div class="stack ${isNext?'ssnext':''}" ${isNext?'id="ssnext"':''} style="gap:6px;min-width:240px;">
    ${isNext?`<div class="badge cyan"><i data-lucide="arrow-right" style="width:12px;height:12px;"></i>NASTĘPNA</div>`:''}
    ${typeSelect(sxId,set,'padding:6px 8px;font-size:12px;')}
    <div class="row" style="gap:6px;flex-wrap:nowrap;">
      <input class="input mono" style="padding:6px 8px;width:86px;" type="number" min="0" step="0.5" value="${esc(set.weight)}" data-action="set-field" data-field="weight" data-sxid="${sxId}" data-setid="${set.id}">
      <input class="input mono" style="padding:6px 8px;width:70px;" type="number" min="0" step="1" value="${esc(set.reps)}" data-action="set-field" data-field="reps" data-sxid="${sxId}" data-setid="${set.id}">
      <input class="input mono" style="padding:6px 8px;width:70px;" type="number" min="0" max="10" step="0.5" value="${esc(set.rpe)}" data-action="set-field" data-field="rpe" data-sxid="${sxId}" data-setid="${set.id}"></div>
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap;">
      <div class="small muted">Obj.: <span class="mono" data-role="vol" data-sxid="${sxId}" data-setid="${set.id}">${r0(v)}</span> kg</div>
      <button class="btn sm ${set.status==='done'?'good':set.status==='skipped'?'danger':''}" data-action="set-status" data-sxid="${sxId}" data-setid="${set.id}">${stBadge(set.status)}</button></div></div>`;}
function supersetCard(ss,exs){const rounds=Math.max(1,...exs.map(e=>e.sets.length));const ssKey=encodeURIComponent(String(ss||''));const nx=ssNext(exs);
  const total=exs.reduce((a,e)=>a+e.sets.length,0),done=exs.reduce((a,e)=>a+e.sets.filter(s=>s.status!=='pending').length,0);
  return `<div class="panel" style="padding:14px;">
    <div class="row" style="justify-content:space-between;">
      <div class="row" style="gap:8px;"><div class="badge purple"><i data-lucide="repeat" style="width:14px;height:14px;"></i>Superseria ${esc(ss)}</div><div class="badge mono">${done}/${total}</div>
        ${nx?`<div class="badge cyan">Następna: #${nx.round+1} ${esc(nx.name)}</div>`:`<div class="badge emerald">Wszystko zrobione</div>`}</div>
      <div class="row" style="gap:8px;">
        <button class="btn sm good" data-action="ss-done-next" data-ss="${ssKey}" ${nx?'':'disabled'}><i data-lucide="check" style="width:16px;height:16px;"></i>Zalicz następną</button>
        <button class="btn sm primary" data-action="ss-add-round" data-ss="${ssKey}"><i data-lucide="plus" style="width:16px;height:16px;"></i>Runda</button></div></div>
    <div class="small muted" style="margin-top:6px;">Przerwy: ${exs.map(e=>`${esc(e.name)} → ${restForSet(e,{type:'work'})}s`).join(' • ')}</div>
    <div class="hr"></div>
    <div class="hscroll"><table><thead><tr><th style="width:70px;">Runda</th>${exs.map(e=>`<th>${esc(e.name)}</th>`).join('')}</tr></thead>
      <tbody>${Array.from({length:rounds},(_,i)=>`<tr><td class="mono">#${i+1}</td>${exs.map(ex=>{const set=ex.sets[i];const isNext=nx&&nx.sx===ex.id&&set&&nx.set===set.id;
        return `<td>${set?supersetSetCell(ex,set,isNext):'<div class="muted small">—</div>'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div></div>`;}

function viewSession(){const s=App.state.sessionActive;

    return `<div class="panel glow-cyan" style="padding:14px;"><div class="row" style="justify-content:space-between;">

        <div class="row" style="justify-content:flex-end;"><button class="btn primary" data-action="session-start-from-plan"><i data-lucide="rocket" style="width:16px;height:16px;"></i>Start</button></div></div>`

    <div class="row" style="justify-content:space-between;"><div class="badge purple"><i data-lucide="activity" style="width:14px;height:14px;"></i>Sesja aktywna</div><div class="badge cyan mono">start ${fmtDateTime(s.startedAt)}</div></div>
    <div class="grid2"><div class="stack"><label class="small muted">Nazwa</label><input class="input" value="${esc(s.name)}" data-action="session-name"></div>

    <div class="row"><span class="badge cyan">Tonaż: <span class="mono" id="kTon">${r0(st.tonnage)}</span> kg</span><span class="badge">Serie: <span class="mono" id="kSets">${st.totalSets}</span></span>
      <span class="badge emerald">Zrobione: <span class="mono" id="kDone">${st.doneSets}</span></span><span class="badge amber">Hard sets: <span class="mono" id="kHard">${st.hard}</span></span><span class="badge">Ćwiczeń: <span class="mono" id="kEx">${st.exercises}</span></span></div>
    <div class="row"><button class="btn" data-action="session-add-exercise"><i data-lucide="plus" style="width:16px;height:16px;"></i>Dodaj ćwiczenie</button>
      <button class="btn danger" data-action="session-discard"><i data-lucide="trash-2" style="width:16px;height:16px;"></i>Porzuć</button></div></div></div>
    ${(()=>{if(!s.exercises.length)return `<div class="panel" style="padding:14px;"><div class="row" style="justify-content:space-between;"><div class="stack" style="gap:4px;"><div style="font-weight:800;">Brak ćwiczeń</div>
        <div class="small muted">Dodaj pierwsze i użyj szablonu serii.</div></div><button class="btn primary" data-action="session-add-exercise"><i data-lucide="plus" style="width:16px;height:16px;"></i>Dodaj</button></div></div>`;
      const seen=new Set();return s.exercises.map(ex=>{const ss=String(ex.superset||'').trim();
        if(ss){if(seen.has(ss))return '';const group=ssGroup(ss);if(group.length>=2){seen.add(ss);return supersetCard(ss,group);}}return exerciseCard(ex);}).join('');})()}
  </div>`;}
function updateStatsUI(){const s=App.state.sessionActive;if(!s)return;const st=stats(s);const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=String(v);};
  set('kTon',r0(st.tonnage));set('kSets',st.totalSets);set('kDone',st.doneSets);set('kHard',st.hard);set('kEx',st.exercises);}
function updateVol(sx,sid){const s=App.state.sessionActive;if(!s)return;const ex=s.exercises.find(x=>x.id===sx);const set=ex?.sets.find(x=>x.id===sid);if(!set)return;

    <div class="panel" style="padding:14px;"><div class="badge amber"><i data-lucide="timer" style="width:14px;height:14px;"></i>Przerwy automatyczne (start po oznaczeniu serii DONE)</div><div class="hr"></div>

/* ========== PROGRESS (okresy + delta) ========== */
function viewProgress(){
  const mode=App.ui.progressMode||'week';const m=hardSetsMatrixByMode(mode);const B=m.buckets;
  let idx=App.ui.progressIndex;if(idx==null||idx<0||idx>=B.length)idx=B.length-1;App.ui.progressIndex=idx;
  const cur=B[idx],prev=B[idx-1]||null;const s=periodSummary(cur),sp=prev?periodSummary(prev):null;const bw=bodyDelta(cur.start,cur.end);
  const D=(a,b,opt={})=>{if(!sp||b==null)return `<span class="small muted">brak poprz.</span>`;const d=a-b;const cls=d>0?'emerald':d<0?'rose':'';
    let txt;if(opt.pct){txt=b>0?`${d>=0?'+':''}${r0(d/b*100)}%`:(d>0?'nowe':'0%');}else if(opt.time){txt=`${d>=0?'+':'−'}${fmtCompact(Math.abs(d))}`;}else{txt=`${d>=0?'+':''}${r1(d)}`;}
    return `<span class="badge ${cls} mono small">${txt} vs poprz.</span>`;};
  const modeName=mode==='week'?'Tydzień':mode==='month'?'Miesiąc':'Rok';
  const kpi=(l,v,dl)=>`<div class="kpi"><div class="small muted">${l}</div><div class="v mono">${v}</div><div style="margin-top:6px;">${dl}</div></div>`;
  const bwPrev=prev?bodyDelta(prev.start,prev.end):null;
  return `<div class="stack">
    <div class="panel glow-cyan" style="padding:14px;"><div class="stack" style="gap:10px;">
      <div class="row" style="justify-content:space-between;"><div class="stack" style="gap:4px;"><div class="badge cyan"><i data-lucide="bar-chart-3" style="width:14px;height:14px;"></i>Progres & statystyki</div>
        <div class="small muted">Hard set = seria robocza/upadkowa/dropset z RPE ≥ ${App.state.settings.hardSetRPE}. Wybierz przedział i okres.</div></div>
        <div class="row" style="gap:8px;">
          <button class="btn sm ${mode==='week'?'primary':''}" data-action="prog-mode" data-mode="week">Tydzień</button>
          <button class="btn sm ${mode==='month'?'primary':''}" data-action="prog-mode" data-mode="month">Miesiąc</button>
          <button class="btn sm ${mode==='year'?'primary':''}" data-action="prog-mode" data-mode="year">Rok</button></div></div>
      <div class="row" style="gap:8px;">
        <button class="btn sm" data-action="prog-step" data-dir="-1" ${idx<=0?'disabled':''}><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>
        <select class="select" id="progPeriod" style="max-width:340px;">${B.map((b,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(bucketLongLabel(b,mode))}${i===B.length-1?' (bieżący)':''}</option>`).join('')}</select>
        <button class="btn sm" data-action="prog-step" data-dir="1" ${idx>=B.length-1?'disabled':''}><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
        <button class="btn sm" data-action="prog-step" data-dir="0">Bieżący</button>
        <span class="badge purple mono">${B.length} okresów</span></div></div></div>

    <div class="panel" style="padding:14px;"><div class="row" style="justify-content:space-between;"><div class="badge emerald"><i data-lucide="calendar-check" style="width:14px;height:14px;"></i>${modeName}: ${esc(bucketLongLabel(cur,mode))}</div>
      <div class="small muted">${prev?`Porównanie z: ${esc(bucketLongLabel(prev,mode))}`:'Brak poprzedniego okresu'}</div></div><div class="hr"></div>
      <div class="grid3">
        ${kpi('Treningi',s.workouts,D(s.workouts,sp?.workouts))}
        ${kpi('Czas',fmtCompact(s.timeSec),D(s.timeSec,sp?.timeSec,{time:true}))}
        ${kpi('Tonaż',`${r0(s.tonnage)} <span class="small muted">kg</span>`,D(s.tonnage,sp?.tonnage,{pct:true}))}
        ${kpi('Hard sets',`<span style="color:#fde68a;">${s.hard}</span>`,D(s.hard,sp?.hard))}
        ${kpi('Serie',s.sets,D(s.sets,sp?.sets))}
        ${kpi('Masa ciała Δ',bw?`${fmtDelta(bw.delta,' kg')} <span class="small muted">(${r1(bw.from)}→${r1(bw.to)})</span>`:'<span class="small muted">brak wpisów</span>',
          (bw&&bwPrev)?`<span class="badge ${bw.delta-bwPrev.delta>0?'amber':'cyan'} mono small">poprz.: ${fmtDelta(bwPrev.delta,' kg')}</span>`:`<span class="small muted">—</span>`)}
      </div></div>

    <div class="panel" style="padding:14px;"><div class="row" style="justify-content:space-between;"><div class="badge purple"><i data-lucide="trending-up" style="width:14px;height:14px;"></i>Tonaż na okres (kliknij słupek, aby wybrać)</div>
      <div class="small muted">tryb: ${modeName.toLowerCase()}</div></div><div class="hr"></div><div id="volChart" class="barwrap"></div></div>

    <div class="panel" style="padding:14px;"><div class="row" style="justify-content:space-between;"><div class="badge amber"><i data-lucide="flame" style="width:14px;height:14px;"></i>Hard sets na partię — wszystkie okresy</div>
      <div class="small muted">wybrany okres podświetlony</div></div><div class="hr"></div>
      <div class="hscroll"><table><thead><tr><th>Partia</th>${B.map((b,i)=>`<th class="${i===idx?'selcol':''}" style="text-align:center;cursor:pointer;" data-action="prog-select-idx" data-idx="${i}">${b.label}</th>`).join('')}<th style="text-align:center;">Σ</th></tr></thead>
        <tbody>${MUSCLES.map(g=>{const row=m.data[g];const sum=row.reduce((a,b)=>a+b,0);return `<tr><td style="font-weight:700;">${g}</td>
          ${row.map((v,i)=>{const a=v/m.max;const bg=v===0?'rgba(2,6,23,.25)':`rgba(34,211,238,${(0.12+a*0.55).toFixed(2)})`;

          <td style="text-align:center;"><span class="badge ${sum>=40?'emerald':sum>=15?'cyan':'rose'} mono">${sum}</span></td></tr>`;}).join('')}

    <div class="grid3"><div class="kpi"><div class="small muted">BMR</div><div class="v mono" id="oB">—</div></div><div class="kpi"><div class="small muted">TDEE</div><div class="v mono" id="oT">—</div></div><div class="kpi"><div class="small muted">Deficyt 15%</div><div class="v mono" id="oC">—</div></div></div></div></div>`;}
function calc1(){const w=num(document.getElementById('c1w')?.value),r=num(document.getElementById('c1r')?.value);const rm=epley(w,r);const o=document.getElementById('c1out');if(o)o.textContent=String(r1(rm));
  const t=document.getElementById('c1tbl');if(!t)return;let h='';for(let p=50;p<=95;p+=5)h+=`<div class="panel soft" style="padding:10px;"><div class="row" style="justify-content:space-between;"><div class="badge cyan mono">${p}%</div><div class="mono">${r1(rm*p/100)} kg</div></div></div>`;t.innerHTML=h;}
function calcP(){const t=num(document.getElementById('pT')?.value),b=num(document.getElementById('pB')?.value,20);const per=document.getElementById('pSide'),out=document.getElementById('pOut'),note=document.getElementById('pNote');
  const rem=t-b;if(rem<0){per.textContent='—';out.innerHTML='';note.textContent='Cel < gryf.';return;}let left=rem/2;per.textContent=String(r1(left));const take=[];
  for(const p of [25,20,15,10,5,2.5,1.25]){let c=0;while(left+1e-9>=p){left=r1(left-p);c++;if(c>20)break;}if(c)take.push(`${c}×${p}kg`);}
  out.innerHTML=take.length?take.map(x=>`<span class="badge purple mono">${x}</span>`).join(''):'<span class="small muted">Sam gryf.</span>';note.textContent=r1(left)>0?`Brakuje ${r1(left)} kg na stronę (niedokładne).`:'Ułożenie dokładne.';}
function calcT(){const sex=document.getElementById('tSex')?.value||'male';const a=num(document.getElementById('tAge')?.value,30),h=num(document.getElementById('tH')?.value,180),w=num(document.getElementById('tW')?.value,80),act=num(document.getElementById('tAct')?.value,1.55);
  const bmr=10*w+6.25*h-5*a+(sex==='male'?5:-161);document.getElementById('oB').textContent=r0(bmr)+' kcal';document.getElementById('oT').textContent=r0(bmr*act)+' kcal';document.getElementById('oC').textContent=r0(bmr*act*0.85)+' kcal';}
function viewAtlas(){const cats=MUSCLES;const rows=[...App.state.exercises].sort((a,b)=>(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name));
  return `<div class="stack"><div class="panel glow-cyan" style="padding:14px;"><div class="row" style="justify-content:space-between;"><div class="badge cyan"><i data-lucide="book-open" style="width:14px;height:14px;"></i>Atlas ćwiczeń</div><div class="badge purple mono">${rows.length}</div></div></div>
    <div class="grid2"><div class="panel" style="padding:14px;"><div class="badge emerald">Dodaj własne</div><div class="hr"></div><div class="stack">
      <div class="grid2"><div class="stack"><label class="small muted">Nazwa</label><input class="input" id="cxName" placeholder="np. Hip thrust"></div><div class="stack"><label class="small muted">Kategoria</label><select class="select" id="cxCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
      <div class="stack"><label class="small muted">Alternatywy (przecinki)</label><input class="input" id="cxAlts"></div><div class="stack"><label class="small muted">Opis</label><textarea class="textarea" id="cxDesc"></textarea></div>
      <div class="row" style="justify-content:flex-end;"><button class="btn primary" data-action="atlas-add"><i data-lucide="save" style="width:16px;height:16px;"></i>Zapisz</button></div></div></div>
    <div class="panel" style="padding:14px;"><div class="badge purple">Lista</div><div class="hr"></div>
      <div class="grid2"><div class="stack"><label class="small muted">Szukaj</label><input class="input" id="atlasSearch"></div><div class="stack"><label class="small muted">Kategoria</label><select class="select" id="atlasCat"><option value="">Wszystkie</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="hr"></div>
      <div class="panel soft" style="padding:10px;max-height:55vh;overflow:auto;"><table><thead><tr><th>Nazwa</th><th>Kat.</th><th class="desktop-only">Opis</th><th></th></tr></thead>
        <tbody>${rows.map(e=>`<tr data-arow="1" data-name="${esc(e.name.toLowerCase())}" data-cat="${esc(e.category||'')}"><td style="font-weight:700;">${esc(e.name)} ${e.source==='custom'?'<span class="badge purple">custom</span>':''}</td>
          <td class="small muted">${esc(e.category||'—')}</td><td class="small muted desktop-only">${esc(e.desc||'')}</td><td style="text-align:right;">
          <button class="btn sm" data-action="atlas-quick" data-exid="${e.id}"><i data-lucide="plus" style="width:14px;height:14px;"></i></button>
          ${e.source==='custom'?`<button class="btn sm danger" data-action="atlas-del" data-exid="${e.id}"><i data-lucide="trash" style="width:14px;height:14px;"></i></button>`:''}</td></tr>`).join('')}</tbody></table></div></div></div></div>`;}
function atlasFilter(){const q=(document.getElementById('atlasSearch')?.value||'').toLowerCase();const c=document.getElementById('atlasCat')?.value||'';
  document.querySelectorAll('[data-arow="1"]').forEach(tr=>{tr.classList.toggle('hide',!((!q||tr.dataset.name.includes(q))&&(!c||tr.dataset.cat===c)));});}
function viewBackup(){return `<div class="stack"><div class="panel glow-cyan" style="padding:14px;"><div class="badge cyan"><i data-lucide="hard-drive" style="width:14px;height:14px;"></i>Synchronizacja & kopia</div><div class="hr"></div>
    <div class="small muted">Backup zawiera: ćwiczenia, plany (z superseriami i przerwami), historię, masę ciała, ustawienia i aktywną sesję.</div></div>
  <div class="grid2"><div class="panel" style="padding:14px;"><div class="badge emerald">Eksport</div><div class="hr"></div><button class="btn primary" data-action="export-json"><i data-lucide="download" style="width:16px;height:16px;"></i>Eksportuj JSON</button></div>
    <div class="panel" style="padding:14px;"><div class="badge rose">Import</div><div class="hr"></div><button class="btn danger" data-action="open-import"><i data-lucide="upload" style="width:16px;height:16px;"></i>Importuj JSON</button></div></div>
  <div class="panel" style="padding:14px;"><div class="badge purple">Narzędzia</div><div class="hr"></div><div class="row" style="justify-content:space-between;">
    <div class="stack" style="gap:4px;"><div style="font-weight:800;">Reset aplikacji</div><div class="small muted">Czyści localStorage i wraca do domyślnych danych.</div></div>
    <button class="btn danger" data-action="hard-reset"><i data-lucide="trash-2" style="width:16px;height:16px;"></i>Reset</button></div></div></div>`;}

/* ========== RENDER ========== */
function renderView(){const h=document.getElementById('view'),r=App.ui.route;
  h.innerHTML=r==='session'?viewSession():r==='coach'?viewCoach():r==='plans'?viewPlans():r==='progress'?viewProgress():r==='body'?viewBody():r==='prs'?viewPRs():
    r==='history'?viewHistory():r==='calculators'?viewCalc():r==='atlas'?viewAtlas():r==='backup'?viewBackup():'<div class="panel" style="padding:14px;">?</div>';
  if(r==='progress')drawVolChart();if(r==='session')updateStatsUI();if(r==='calculators')setTimeout(()=>{calc1();calcP();calcT();},0);if(r==='session')setTimeout(syncDays,0);}
function render(){renderNav();renderTabbar();renderHeader();renderView();renderActionBar();updateRest();updateStopwatch();icons();}
function rerenderView(){renderView();renderActionBar();icons();}
function syncDays(){const ps=document.getElementById('startPlanSelect'),ds=document.getElementById('startDaySelect');if(!ps||!ds)return;const p=App.state.plans.find(x=>x.id===ps.value);
  ds.innerHTML=(p?.days||[]).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');}

/* ========== PICKER ========== */
function openPicker(txt){document.getElementById('pickerContextBadge').textContent=txt;document.getElementById('pickerSearch').value='';document.getElementById('pickerCategory').value='';renderPicker();document.getElementById('exercisePicker').showModal();}
function renderPicker(){const q=(document.getElementById('pickerSearch')?.value||'').toLowerCase();const c=(document.getElementById('pickerCategory')?.value||'');
  const list=App.state.exercises.filter(e=>(!c||e.category===c)&&(!q||e.name.toLowerCase().includes(q))).sort((a,b)=>(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name));
  document.getElementById('pickerTbody').innerHTML=list.map(e=>`<tr><td style="font-weight:800;">${esc(e.name)}</td><td class="small muted">${esc(e.category||'—')}</td><td class="small muted desktop-only">${esc(e.desc||'')}</td>
    <td style="text-align:right;"><button class="btn primary sm" data-action="picker-add" data-exid="${e.id}"><i data-lucide="plus" style="width:14px;height:14px;"></i>Dodaj</button></td></tr>`).join('');icons();}

/* ========== EVENTS ========== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
  if(a==='toast-close'){document.getElementById(b.dataset.id)?.remove();return;}
  if(a==='toggle-sidebar'){toggleSidebar();return;}if(a==='close-sidebar'){closeSidebar();return;}
  if(a==='nav'){setRoute(b.dataset.route);return;}if(a==='go-session'){setRoute('session');return;}
  // rest
  if(a==='rest-preset'){startRest(num(b.dataset.sec,90));return;}
  if(a==='rest-skip'){skipRest();toast('Timer pominięty.','warn',1800);return;}
  if(a==='rest-custom'){document.getElementById('customRestSeconds').value=App.state.settings.defaultRestSec;document.getElementById('customRestDefault').checked=false;document.getElementById('customRestDialog').showModal();return;}
  if(a==='custom-rest-apply'){const s=clamp(r0(num(document.getElementById('customRestSeconds').value,90)),5,3600);if(document.getElementById('customRestDefault').checked){App.state.settings.defaultRestSec=s;save();}startRest(s);render();return;}
  // progress
  if(a==='prog-mode'){App.ui.progressMode=b.dataset.mode||'week';App.ui.progressIndex=null;rerenderView();return;}
  if(a==='prog-step'){const d=r0(b.dataset.dir);const n=bucketsForMode(App.ui.progressMode).length;App.ui.progressIndex=d===0?n-1:clamp((App.ui.progressIndex??n-1)+d,0,n-1);rerenderView();return;}
  if(a==='prog-select-idx'){App.ui.progressIndex=r0(b.dataset.idx);rerenderView();return;}
  // body
  if(a==='body-add'){const kg=num(document.getElementById('bwKg')?.value,0);if(kg<=0){toast('Podaj wagę.','warn');return;}
    const ds=document.getElementById('bwDate')?.value;const ts=ds?new Date(ds+'T12:00:00').getTime():Date.now();
    App.state.body.push({id:uid('bw'),ts:Number.isFinite(ts)?ts:Date.now(),kg:r1(kg),waist:r1(num(document.getElementById('bwWaist')?.value,0)),notes:(document.getElementById('bwNotes')?.value||'').trim()});
    save();rerenderView();toast('Pomiar zapisany.','success',1800);return;}
  if(a==='body-del'){if(!confirm('Usunąć pomiar?'))return;App.state.body=App.state.body.filter(x=>x.id!==b.dataset.id);save();rerenderView();return;}
  // supersets
  if(a==='ss-add-round'){supersetAddRound(decodeURIComponent(b.dataset.ss||''));render();scrollToNext();return;}
  if(a==='ss-done-next'){const ss=decodeURIComponent(b.dataset.ss||'');const nx=ssNext(ssGroup(ss));if(!nx){toast('Superseria ukończona.','success');return;}
    App.ui.activeSxId=nx.sx;toggleStatus(nx.sx,nx.set);render();scrollToNext();return;}
  // session
  if(a==='quick-new-workout'||a==='session-start-empty'){App.state.sessionActive={id:uid('sess'),name:'Trening (pusty)',startedAt:Date.now(),notes:'',exercises:[]};App.ui.activeSxId=null;save();
    App.ui.route='session';document.body.setAttribute('data-route','session');render();toast('Nowa sesja.','success',2000);return;}
  if(a==='session-discard'){if(!confirm('Porzucić sesję?'))return;App.state.sessionActive=null;App.ui.activeSxId=null;skipRest();save();render();toast('Porzucono.','warn');return;}
  if(a==='finish-workout'){if(confirm('Zakończyć trening i zapisać?'))finishWorkout();return;}
  if(a==='session-add-exercise'){App.ui.picker={mode:'session'};openPicker('Dodaj do sesji');return;}
  if(a==='session-start-from-plan'){const p=document.getElementById('startPlanSelect'),d=document.getElementById('startDaySelect');if(p&&d)startFromPlan(p.value,d.value);return;}
  if(a==='select-exercise'){App.ui.activeSxId=b.dataset.sxid;render();return;}
  if(a==='session-add-set-active'){if(App.ui.activeSxId){const s=App.state.sessionActive;const ex=s?.exercises.find(x=>x.id===App.ui.activeSxId);const ss=String(ex?.superset||'').trim();
      if(ss&&ssGroup(ss).length>=2){supersetAddRound(ss);render();return;}sessAddSet(App.ui.activeSxId);render();}return;}
  if(a==='set-add'){App.ui.activeSxId=b.dataset.sxid;sessAddSet(b.dataset.sxid);render();return;}
  if(a==='set-delete'){sessDelSet(b.dataset.sxid,b.dataset.setid);render();return;}
  if(a==='set-status'){App.ui.activeSxId=b.dataset.sxid;toggleStatus(b.dataset.sxid,b.dataset.setid);render();
    const ex=App.state.sessionActive?.exercises.find(x=>x.id===b.dataset.sxid);if(ex&&String(ex.superset||'').trim()&&ssGroup(ex.superset).length>=2)scrollToNext();return;}
  if(a==='exercise-remove'){if(!confirm('Usunąć ćwiczenie z sesji?'))return;const s=App.state.sessionActive;s.exercises=s.exercises.filter(x=>x.id!==b.dataset.sxid);
    if(App.ui.activeSxId===b.dataset.sxid)App.ui.activeSxId=s.exercises[0]?.id||null;save();render();return;}
  if(a==='step'){const sx=b.dataset.sxid,sid=b.dataset.setid,f=b.dataset.field,d=num(b.dataset.delta);const s=App.state.sessionActive;const ex=s?.exercises.find(x=>x.id===sx);const set=ex?.sets.find(x=>x.id===sid);if(!set)return;
    const cur=num(set[f],f==='rpe'?8:0);const nv=(f==='reps')?Math.max(0,r0(cur+d)):Math.max(0,r1(cur+d));sessSetField(sx,sid,f,nv);
    document.querySelectorAll(`[data-action="set-field"][data-field="${f}"][data-sxid="${CSS.escape(sx)}"][data-setid="${CSS.escape(sid)}"]`).forEach(i=>i.value=String(nv));updateVol(sx,sid);return;}
  if(a==='apply-suggestion'){applySuggestion(b.dataset.sxid);return;}
  if(a==='open-template'){openTemplateDialog(b.dataset.sxid);return;}if(a==='apply-template'){applyTemplate(b.dataset.tpl);return;}
  if(a==='picker-add'){const id=b.dataset.exid;if(App.ui.picker.mode==='session')sessAddExercise(id);else if(App.ui.picker.mode==='plan')planAddEx(App.ui.picker.planId,App.ui.picker.dayId,id);
    document.getElementById('exercisePicker').close();render();toast('Dodano.','success',1500);return;}
  // plans
  if(a==='plan-create'){const p=planCreate();App.ui.planEditorId=p.id;render();return;}
  if(a==='plan-edit'){App.ui.planEditorId=b.dataset.planid;render();return;}if(a==='plan-back'){App.ui.planEditorId=null;render();return;}
  if(a==='plan-duplicate'){planDup(b.dataset.planid);render();return;}if(a==='plan-archive'){planArch(b.dataset.planid);return;}
  if(a==='plan-add-day'){planAddDay(b.dataset.planid);return;}if(a==='plan-day-remove'){if(confirm('Usunąć dzień?'))planDelDay(b.dataset.planid,b.dataset.dayid);return;}
  if(a==='plan-day-add-exercise'){App.ui.picker={mode:'plan',planId:b.dataset.planid,dayId:b.dataset.dayid};openPicker('Dodaj do planu');return;}
  if(a==='plan-ex-move'){planMove(b.dataset.planid,b.dataset.dayid,r0(b.dataset.index),r0(b.dataset.dir));return;}
  if(a==='plan-ex-remove'){if(confirm('Usunąć ćwiczenie?'))planDelEx(b.dataset.planid,b.dataset.dayid,b.dataset.pxid);return;}
  if(a==='start-from-plan'){if(App.state.sessionActive&&!confirm('Masz aktywną sesję. Zastąpić?'))return;startFromPlan(b.dataset.planid,b.dataset.dayid);return;}
  // history
  if(a==='history-toggle'){const id=b.dataset.id;App.ui.historyExpanded.has(id)?App.ui.historyExpanded.delete(id):App.ui.historyExpanded.add(id);render();return;}
  if(a==='history-delete'){if(!confirm('Usunąć wpis?'))return;App.state.history=App.state.history.filter(w=>w.id!==b.dataset.id);save();render();return;}
  if(a==='history-clear'){if(!confirm('Usunąć CAŁĄ historię?'))return;App.state.history=[];App.ui.historyExpanded=new Set();save();render();toast('Wyczyszczono.','warn');return;}
  // calcs
  if(a==='calc-1rm'){calc1();return;}if(a==='calc-plates'){calcP();return;}if(a==='calc-tdee'){calcT();return;}
  // atlas
  if(a==='atlas-add'){const n=(document.getElementById('cxName').value||'').trim();if(!n){toast('Podaj nazwę.','warn');return;}
    if(App.state.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase())){toast('Już istnieje.','warn');return;}
    App.state.exercises.push({id:uid('ex'),source:'custom',name:n,category:document.getElementById('cxCat').value,primary:document.getElementById('cxCat').value,
      alts:(document.getElementById('cxAlts').value||'').split(',').map(x=>x.trim()).filter(Boolean),desc:(document.getElementById('cxDesc').value||'').trim()});save();render();toast('Dodano ćwiczenie.','success');return;}
  if(a==='atlas-del'){const e=exById(b.dataset.exid);if(!e||e.source!=='custom')return;if(!confirm(`Usunąć ${e.name}?`))return;
    App.state.exercises=App.state.exercises.filter(x=>x.id!==e.id);App.state.plans.forEach(p=>p.days.forEach(d=>d.exercises=d.exercises.filter(x=>x.exerciseName!==e.name)));
    if(App.state.sessionActive)App.state.sessionActive.exercises=App.state.sessionActive.exercises.filter(x=>x.exerciseId!==e.id);save();render();toast('Usunięto.','success');return;}
  if(a==='atlas-quick'){if(!App.state.sessionActive&&!confirm('Brak sesji. Utworzyć nową?'))return;sessAddExercise(b.dataset.exid);save();App.ui.route='session';document.body.setAttribute('data-route','session');render();toast('Dodano do sesji.','success',1600);return;}
  // backup
  if(a==='export-json'){exportJSON();return;}if(a==='open-import'){document.getElementById('importDialog').showModal();return;}
  if(a==='import-json'){const f=document.getElementById('importFile')?.files?.[0];if(!f){toast('Wybierz plik.','warn');return;}importJSON(f);return;}
  if(a==='hard-reset'){if(!confirm('Zresetować wszystko?'))return;localStorage.removeItem(STORAGE_KEY);App.state=clone(DEFAULT_STATE);App.ui.route='session';App.ui.planEditorId=null;
    App.ui.historyExpanded=new Set();App.ui.activeSxId=null;App.ui.progressIndex=null;skipRest();document.body.setAttribute('data-route','session');render();toast('Reset OK.','success');return;}
});

document.addEventListener('input',e=>{const el=e.target.closest('[data-action]');
  if(el){const a=el.dataset.action;
    if(a==='session-name'){App.state.sessionActive.name=el.value;save();renderHeader();renderActionBar();return;}
    if(a==='session-notes'){App.state.sessionActive.notes=el.value;save();return;}
    if(a==='exercise-field'){sessExField(el.dataset.sxid,el.dataset.field,el.value);return;}
    if(a==='set-field'){sessSetField(el.dataset.sxid,el.dataset.setid,el.dataset.field,el.value);updateVol(el.dataset.sxid,el.dataset.setid);return;}
    if(a==='plan-field'){const p=App.state.plans.find(x=>x.id===el.dataset.planid);if(p){p.name=el.value;save();}return;}
    if(a==='plan-day-field'){const p=App.state.plans.find(x=>x.id===el.dataset.planid);const d=p?.days.find(x=>x.id===el.dataset.dayid);if(d){d.name=el.value;save();}return;}
    if(a==='plan-ex-field'){planExField(el.dataset.planid,el.dataset.dayid,el.dataset.pxid,el.dataset.field,el.value);return;}
    if(a==='glob-prog'){const f=el.dataset.field;if(f==='mode')App.state.settings.progression[f]=el.value;else if(el.type==='checkbox')App.state.settings.progression[f]=!!el.checked;
      else App.state.settings.progression[f]=num(el.value,App.state.settings.progression[f]);save();return;}
    if(a==='ex-prog'){setProgCfg(el.dataset.ex,el.dataset.field,el.value);return;}
    if(a==='rest-rule'){App.state.settings.restByType[el.dataset.type]=clamp(r0(num(el.value,0)),0,3600);save();return;}
    if(a==='rest-default'){App.state.settings.defaultRestSec=clamp(r0(num(el.value,90)),5,3600);save();return;}
  }
  if(e.target.id==='progPeriod'){App.ui.progressIndex=r0(e.target.value);rerenderView();return;}
  if(e.target.id==='pickerSearch'||e.target.id==='pickerCategory'){renderPicker();return;}
  if(e.target.id==='startPlanSelect'){syncDays();return;}
  if(e.target.id==='atlasSearch'||e.target.id==='atlasCat'){atlasFilter();return;}
  if(e.target.id==='coachSearch'){App.ui.coachFilter=e.target.value;clearTimeout(window.__cf);window.__cf=setTimeout(()=>{renderView();icons();
    const i=document.getElementById('coachSearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);return;}
});

/* ========== BOOT ========== */
function boot(){if(!App.ui.tick)App.ui.tick=setInterval(()=>{updateRest();updateStopwatch();const n=document.getElementById('nowBadge');if(n)n.textContent=fmtDateTime(Date.now());},250);
  document.body.setAttribute('data-route',App.ui.route);render();
  try{const k='ifp.hint.v4';if(!localStorage.getItem(k)){localStorage.setItem(k,'1');toast('Nowość: okresy w Progresie, delta vs poprzedni, guided superserie, przerwy wg typu, Masa ciała.','info',7000);}}catch(_){}}
boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
